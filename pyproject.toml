[project]
name = "understory"
version = "0.1.0"
description = "Commit-pinned repository understanding with inspectable evidence"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
  "pgvector>=0.4,<1",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.7,<1"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-timeout>=2,<3", "ruff>=0.11,<1"]

[project.scripts]
understory-api = "app.main:run"
understory-worker = "app.worker:main"
understory-demo = "app.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 60

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
